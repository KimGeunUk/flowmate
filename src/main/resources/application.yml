spring:
  application:
    name: flowmate
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/flowmate
    username: flowmate
    password: flowmate
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  servlet:
    # 설정하지 않으면 기본 1MB 에서 조용히 막힌다 (Task 10).
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  # 재귀 스캔이므로 클래스 단순명이 전 패키지에서 유일해야 한다
  type-aliases-package: com.flowmate
  configuration:
    map-underscore-to-camel-case: true

flowmate:
  approval:
    # 결재선 정책 교체 지점. default | simple-two-step
    # 고객사별 납품에서 코드를 고치지 않고 이 값만 바꾼다.
    line-policy: default
  attendance:
    # 근태 판정 정책 교체 지점 (계획서 4 D7). default | flex
    work-time-policy: default
    # 연차 부여 정책 교체 지점. flat | tenure
    leave-grant-policy: flat
  upload:
    # 첨부파일 저장 위치. 저장 경로는 {base-dir}/approval/{yyyy}/{MM}/{UUID}.{ext}
    # .gitignore 의 /upload/ 와 짝이다 — 기본값을 바꾸면 그쪽도 함께 바꾼다.
    base-dir: ./upload
    max-file-size: 10MB

ai:
  enabled: false          # 기본값 - API 키 없이 빌드·실행된다 (계획서 3 D3)
  # AI 제공자 교체 지점(LlmConfig 참고). claude | gemini - ai.enabled=true 일 때만 의미가 있다.
  # gemini 가 기본값인 이유: 무료 등급이 있다(Claude 는 유료뿐이다).
  provider: gemini
  # gemini-2.0-flash 는 폐지됐고(404/429 로 quota 오류처럼 보이지만 실제로는 폐지) gemini-2.5-*
  # 계열은 신규 사용자에게 닫혀 있다(404 "no longer available to new users") - 수동 검증으로
  # 확인한 것이다. gemini-3.5-flash-lite 가 현재 신규 키로 실제 동작하는 모델이다.
  model: gemini-3.5-flash-lite  # claude 로 되돌리려면 provider: claude 와 model: claude-opus-5 를 함께 바꾼다
  timeout-seconds: 30
  # 프롬프트 저장소 교체 지점(커스터마이징 지점 4, 계획서 5 Task 8). file | database
  # database 는 ai_prompt 테이블에서 읽는다 - PromptRepositoryConfig 참고.
  prompt-repository: file
  features:
    summary: true
    preflight: true
    leave-context: true

logging:
  level:
    com.flowmate: DEBUG
