spring:
  application:
    name: flowmate
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/flowmate
    username: flowmate
    password: flowmate
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  # 재귀 스캔이므로 클래스 단순명이 전 패키지에서 유일해야 한다
  type-aliases-package: com.flowmate
  configuration:
    map-underscore-to-camel-case: true

flowmate:
  approval:
    # 결재선 정책 교체 지점. default | simple-two-step
    # 고객사별 납품에서 코드를 고치지 않고 이 값만 바꾼다.
    line-policy: default

logging:
  level:
    com.flowmate: DEBUG
