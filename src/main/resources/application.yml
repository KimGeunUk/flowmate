spring:
  application:
    name: flowmate
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/flowmate
    username: flowmate
    password: flowmate
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  servlet:
    # 설정하지 않으면 기본 1MB 에서 조용히 막힌다 (Task 10).
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  # 재귀 스캔이므로 클래스 단순명이 전 패키지에서 유일해야 한다
  type-aliases-package: com.flowmate
  configuration:
    map-underscore-to-camel-case: true

flowmate:
  approval:
    # 결재선 정책 교체 지점. default | simple-two-step
    # 고객사별 납품에서 코드를 고치지 않고 이 값만 바꾼다.
    line-policy: default
  upload:
    # 첨부파일 저장 위치. 저장 경로는 {base-dir}/approval/{yyyy}/{MM}/{UUID}.{ext}
    # .gitignore 의 /upload/ 와 짝이다 — 기본값을 바꾸면 그쪽도 함께 바꾼다.
    base-dir: ./upload
    max-file-size: 10MB

ai:
  enabled: false          # 기본값 - API 키 없이 빌드·실행된다 (계획서 3 D3)
  model: claude-opus-5
  timeout-seconds: 30
  features:
    summary: true
    preflight: true
    leave-context: true

logging:
  level:
    com.flowmate: DEBUG
