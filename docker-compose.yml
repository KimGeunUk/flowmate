# Phase 2 사전점검: WAR 를 실제 외부 Tomcat 10.1 컨테이너에 배포해 본다.
services:
  postgres:
    image: postgres:16-alpine
    container_name: flowmate-postgres
    environment:
      POSTGRES_DB: flowmate
      POSTGRES_USER: flowmate
      POSTGRES_PASSWORD: flowmate
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
      # 한글 정렬·비교를 예측 가능하게 하려고 초기화 시 로케일을 고정한다
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      # 알파벳 순으로 실행된다. 데이터 볼륨이 비어 있을 때만 실행되는 점에 주의.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - flowmate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmate -d flowmate"]
      interval: 5s
      timeout: 3s
      retries: 10

  tomcat:
    # 프로젝트의 Tomcat 10.1 / Java 17 전제와 맞춘다 (pom.xml 의 tomcat-embed-* 10.1.55, provided).
    image: tomcat:10.1-jre17
    container_name: flowmate-tomcat
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 커밋된 application.yml 의 spring.datasource.url 은 localhost:5432 를 가리키는데,
      # 이는 로컬에서 mvnw spring-boot:run 으로 띄울 때(내장 Tomcat, 호스트에서 직접 실행)를
      # 위한 값이다. 이 Tomcat 컨테이너 안에서 localhost 는 컨테이너 자기 자신이지
      # postgres 컨테이너가 아니므로 그 기본값 그대로는 DB 접속이 실패한다.
      # application.yml 자체는 건드리지 않고, Spring Boot 가 읽는 환경변수
      # SPRING_DATASOURCE_URL 로 compose 서비스명(postgres)을 가리키도록 덮어쓴다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowmate
      # 슬림한 리눅스 베이스 이미지는 LANG/LC_ALL 이 POSIX(C) 인 경우가 많다.
      # JDK 17은 JEP 400(UTF-8 기본값, JDK 18부터) 이전이라 file.encoding 을
      # 그 플랫폼 로케일에서 가져오므로, 지정하지 않으면 컨테이너 안에서만
      # 한글이 깨질 수 있다(로컬 Windows 개발 PC는 이미 UTF-8/MS949라 증상이 없다).
      # 그래서 컨테이너 JVM 에만 명시적으로 고정해 준다.
      # (검증 결과: 이 이미지의 JDK 17.0.19(Temurin, Ubuntu 24.04 베이스)는 LANG/LC_ALL 이
      #  비어 있어도 file.encoding/native.encoding 을 이미 UTF-8 로 잡는다 — JDK 17.0.8+ 에
      #  들어간 "로케일이 POSIX/C 면 US-ASCII 대신 UTF-8" 보정 때문이다. 그래도 더 오래된
      #  17.0.x 패치나 다른 배포판/이미지에서는 이 보정이 없을 수 있으므로 방어적으로 계속 고정한다.)
      CATALINA_OPTS: -Dfile.encoding=UTF-8
      TZ: Asia/Seoul
    ports:
      # 로컬 spring-boot:run(내장 Tomcat, 8080)과 충돌하지 않도록 다른 포트로 발행한다.
      - "18080:8080"
    volumes:
      # 컨테이너가 WAR 파일을 수정할 이유가 없으므로 읽기 전용으로 마운트한다.
      # flowmate.war 로 배포해 컨텍스트 경로를 /flowmate 로 고정한다(검증 결과에 따른 선택).
      # ROOT.war 로도 배포·동작을 확인했지만, ROOT 배포는 contextPath 가 "" 가 되어
      # ${pageContext.request.contextPath} 를 하드코딩된 절대경로와 구분하지 못한다.
      # 실제 배치 대상(여러 WAR 를 함께 올리는 공용 Tomcat)과도 더 가깝다.
      - ./target/flowmate.war:/usr/local/tomcat/webapps/flowmate.war:ro

volumes:
  flowmate-pgdata:
